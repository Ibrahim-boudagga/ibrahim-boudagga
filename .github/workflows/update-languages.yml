
name: Update Profile Languages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate language section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Ibrahim-boudagga
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from collections import Counter
          from pathlib import Path

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GITHUB_TOKEN"]
          totals = Counter()
          page = 1

          while True:
              url = (
                  "https://api.github.com/users/"
                  f"{username}/repos?per_page=100&page={page}"
                  "&type=owner&sort=updated"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )

              with urllib.request.urlopen(request) as response:
                  repos = json.load(response)

              if not repos:
                  break

              for repo in repos:
                  if repo["fork"] or repo["archived"]:
                      continue

                  lang_url = repo["languages_url"]
                  req = urllib.request.Request(
                      lang_url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                      },
                  )

                  with urllib.request.urlopen(req) as response:
                      languages = json.load(response)

                  totals.update(languages)

              if len(repos) < 100:
                  break
              page += 1

          total_bytes = sum(totals.values())
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          start = "<!-- AUTO-LANGUAGES:START -->"
          end = "<!-- AUTO-LANGUAGES:END -->"

          if start not in content or end not in content:
              raise SystemExit("Language section markers are missing.")

          lines = [
              "| Language | Code size | Share |",
              "|---|---:|---:|",
          ]

          for language, size in totals.most_common():
              share = size * 100 / total_bytes if total_bytes else 0
              lines.append(
                  f"| {language} | {size:,} bytes | {share:.1f}% |"
              )

          if not totals:
              lines.append("| No detected languages | — | — |")

          replacement = (
              start + "\n\n"
              + "\n".join(lines)
              + "\n\n<sub>Aggregated from non-fork, "
                "non-archived public repositories.</sub>\n"
              + end
          )

          before, remainder = content.split(start, 1)
          _, after = remainder.split(end, 1)
          readme.write_text(
              before + replacement + after,
              encoding="utf-8",
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || \
            git commit -m "chore: update profile language statistics"
          git push
